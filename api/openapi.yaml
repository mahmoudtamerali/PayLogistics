components:
  schemas:
    EraseRequest:
      title: "EraseRequest"
      required:
      - "confirm"
      - "reason"
      type: "object"
      properties:
        confirm:
          type: "boolean"
        reason:
          maxLength: 500
          minLength: 5
          type: "string"
    RequestUpload:
      title: "RequestUpload"
      required:
      - "contentType"
      - "fileName"
      - "patient_id"
      - "sizeBytes"
      type: "object"
      properties:
        patient_id:
          maxLength: 128
          minLength: 1
          type: "string"
        fileName:
          maxLength: 100
          minLength: 1
          type: "string"
        contentType:
          type: "string"
          enum:
          - "application/pdf"
          - "image/png"
          - "image/jpeg"
        sizeBytes:
          maximum: 1.048576E+7
          minimum: 1.0
          type: "integer"
    CreateAssignment:
      title: "CreateAssignment"
      required:
      - "clinician_id"
      - "patient_id"
      type: "object"
      properties:
        clinician_id:
          maxLength: 128
          minLength: 1
          type: "string"
        patient_id:
          maxLength: 128
          minLength: 1
          type: "string"
    UpdatePatientProfile:
      title: "UpdatePatientProfile"
      type: "object"
      properties:
        fullName:
          maxLength: 150
          minLength: 1
          type: "string"
        email:
          maxLength: 254
          minLength: 3
          type: "string"
        phone:
          maxLength: 25
          minLength: 7
          type: "string"
    CreateVisitNote:
      title: "CreateVisitNote"
      required:
      - "note"
      - "title"
      type: "object"
      properties:
        title:
          maxLength: 120
          minLength: 1
          type: "string"
        note:
          maxLength: 5000
          minLength: 1
          type: "string"
    CreateAppointment:
      title: "CreateAppointment"
      required:
      - "clinician_id"
      - "startsAt"
      - "visitType"
      type: "object"
      properties:
        patient_id:
          maxLength: 128
          minLength: 1
          type: "string"
        clinician_id:
          maxLength: 128
          minLength: 1
          type: "string"
        startsAt:
          maxLength: 35
          minLength: 20
          type: "string"
        visitType:
          type: "string"
          enum:
