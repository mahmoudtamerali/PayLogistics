openapi: "3.0.1"
info:
  title: "securecare-api"
  description: "SecureCare authenticated healthcare API. API Gateway Cognito authorizer\
    \ validates identity using the securecare-cognito User Pool authorizer; use a\
    \ Cognito ID token in Authorization with no OAuth scopes. Cognito groups are patient,\
    \ doctor, staff, and admin. Fine-grained RBAC, patient ownership, assignment checks,\
    \ field-level rules, and PHI policy remain enforced inside each Lambda; request\
    \ values never grant access. This Regional REST API in eu-west-1 defines 22 business\
    \ methods and unauthenticated mock OPTIONS methods. Export/erasure requests persist\
    \ tracking records; 202 is valid only when asynchronous SQS processing is deployed.\
    \ Cross-origin CORS is configured for https://outship.me. To use a frontend subdomain\
    \ such as https://app.outship.me, replace the allowed origin consistently in every\
    \ OPTIONS mock response and DEFAULT_4XX/DEFAULT_5XX gateway response, and configure\
    \ the matching API Gateway custom domain/base-path mapping and TLS certificate\
    \ plus the CloudFront origin/behavior as applicable. If CloudFront serves both\
    \ the frontend and /api/* from the same origin, remove cross-origin CORS headers;\
    \ keep OPTIONS only if required by routing. Lambda proxy handlers must return\
    \ matching Access-Control-Allow-Origin and Vary: Origin headers for cross-origin\
    \ responses."
  version: "4.0.0"
servers:
- url: "https://h3e3y51de3.execute-api.eu-west-1.amazonaws.com/{basePath}"
  variables:
    basePath:
      default: "dev"
