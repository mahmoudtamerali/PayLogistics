# Source security scans: secrets (Gitleaks), SAST (Semgrep), SCA/FS (Trivy), and IaC (Checkov).
# Gitleaks, Semgrep (ERROR severity) and Trivy (fixable HIGH/CRITICAL) block the run.
# Checkov reports only, but a broken Checkov run now fails the step.
name: security-scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}
  workflow_call: {} # Lets deploy-frontend run this scan before publishing

permissions:
  contents: read

jobs:
  scan:
    name: Secrets, SAST, SCA and IaC scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (secrets, fails on finding)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep (SAST, fails on ERROR severity)
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:latest \
            semgrep scan --config p/default --metrics=off --severity ERROR --error

      - name: Trivy on source files (dependencies and config, fails on fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace aquasec/trivy:latest \
            fs . \
            --format table \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1

      - name: Checkov (Terraform IaC scan, report only)
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace bridgecrew/checkov:latest \
            --directory infra --framework terraform --soft-fail