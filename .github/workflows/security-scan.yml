# Source security scans: secrets (Gitleaks), SAST (Semgrep), SCA/FS (Trivy), and IaC (Checkov).
# Gitleaks fails on secrets; Semgrep, Trivy, and Checkov start in report-only mode while tuning.
name: security-scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    name: Secrets, SAST, SCA and IaC scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (secrets, fails on finding)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep (SAST, report only)
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:latest \
            semgrep scan --config auto --metrics=off --quiet || true

      - name: Trivy on source files (dependencies and config, report only)
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace aquasec/trivy:latest \
            fs . \
            --format table \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 0

      - name: Checkov (Terraform IaC scan, report only)
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace bridgecrew/checkov:latest \
            -d infra terraform --soft-fail || true