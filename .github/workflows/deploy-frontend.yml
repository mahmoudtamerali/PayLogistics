# Publish the static frontend to S3 (T98, first version: no CloudFront yet).
name: deploy-frontend

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # Required for AWS OIDC

env:
  AWS_REGION: eu-west-1
  BUCKET: paylogistics-web-project-2026

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_FRONTEND_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish to S3
        run: |
          aws s3 sync frontend/ "s3://${BUCKET}/" --exclude "README.md"
