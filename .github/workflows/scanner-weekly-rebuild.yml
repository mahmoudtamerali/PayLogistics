# Weekly rebuild of the scanner image (T57 / T59).
# Rebuilds from scratch, runs image_gate.py, pushes to ECR via OIDC, and signs with cosign.
name: scanner-weekly-rebuild

on:
  schedule:
    - cron: "0 5 * * 1" # Every Monday 05:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # Required for AWS OIDC and cosign keyless signing

env:
  AWS_REGION: us-east-1
  REPOSITORY: securecare-scanner

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build from scratch (fresh base image, fresh signatures)
        run: |
          docker build --pull --no-cache --platform linux/amd64 \
            -t securecare-scanner:candidate scanner

      - name: Install Trivy CLI
        run: |
          CID=$(docker create aquasec/trivy:latest)
          docker cp "$CID:/usr/local/bin/trivy" /usr/local/bin/trivy
          docker rm "$CID"
          chmod +x /usr/local/bin/trivy
          trivy --version

      - name: Image gate (blocks HIGH/CRITICAL fixable findings)
        run: |
          mkdir -p evidence
          ACCEPT=""
          if [ -f infra/scripts/image-accept.txt ]; then
            ACCEPT="--accept-file infra/scripts/image-accept.txt"
          fi
          python3 infra/scripts/image_gate.py \
            --image securecare-scanner:candidate \
            --out evidence/image-gate-scanner.txt $ACCEPT

      - name: Show signature date baked into image
        run: docker run --rm --entrypoint cat securecare-scanner:candidate /etc/signatures-built-at

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Push to Amazon ECR
        id: push
        run: |
          REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          DATE="$(date -u +%Y%m%d)"
          docker tag securecare-scanner:candidate "$REGISTRY/${REPOSITORY}:${DATE}"
          docker tag securecare-scanner:candidate "$REGISTRY/${REPOSITORY}:latest"
          docker push "$REGISTRY/${REPOSITORY}:${DATE}"
          docker push "$REGISTRY/${REPOSITORY}:latest"
          DIGEST="$(aws ecr describe-images \
            --region "$AWS_REGION" \
            --repository-name "$REPOSITORY" \
            --image-ids imageTag="${DATE}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign pushed image (OIDC keyless)
        run: |
          cosign sign --yes "${{ steps.push.outputs.registry }}/${{ env.REPOSITORY }}@${{ steps.push.outputs.digest }}"

      - name: Keep gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-gate-scanner
          path: evidence/image-gate-scanner.txt
          if-no-files-found: ignore